# Tag Drifter on TrueNAS SCALE (Apps > Discover Apps > ⋮ > Install via YAML), or any Docker host.
# Replace the two /mnt/... host paths with your datasets; see docs/deployment.md.
services:
  tagdrifter:
    image: ghcr.io/emilystap/tagdrifter:latest
    container_name: tagdrifter
    restart: unless-stopped
    user: "568:568" # TrueNAS "apps" user; needs read access to the library, write to /data
    # The app needs no Linux capabilities or privilege changes.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    volumes:
      # The library, read-only: Tag Drifter only reports for now.
      - /mnt/POOL/media/music:/music:ro
      # SQLite database (tag cache, scan history, issues). Back this up with the app dataset.
      - /mnt/POOL/apps/tagdrifter/data:/data
      # Optional: a config.toml for per-check options (see config.example.toml).
      # - /mnt/POOL/apps/tagdrifter/config:/config:ro
    environment:
      TZ: Etc/UTC # your time zone, e.g. America/New_York, for the schedule and logs
      TAGDRIFTER_SCHEDULE: "0 4 * * *" # cron (min hour day month weekday), or "off"
      TAGDRIFTER_CASE_SENSITIVE: "true" # match the dataset's case sensitivity
      TAGDRIFTER_WORKERS: "8" # parallel tag reads; mainly affects the first scan
