# Tag Drifter with Docker Compose: `docker compose up -d`.
# Replace the /path/to/... host paths with your own; see docs/deployment.md.
services:
  tagdrifter:
    image: ghcr.io/emilystap/tagdrifter:latest
    container_name: tagdrifter
    restart: unless-stopped
    user: "568:568" # needs read access to the library and write access to /data
    # The app needs no Linux capabilities or privilege changes.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    volumes:
      # The library, read-only. To rename files from the UI, use :rw and set TAGDRIFTER_FIX.
      - /path/to/music:/music:ro
      # SQLite database (tag cache, scan history, issues). Back this up with your app data.
      - /path/to/tagdrifter/data:/data
      # Optional: a config.toml for per-check options (see config.example.toml).
      # - /path/to/tagdrifter/config:/config:ro
    environment:
      TZ: Etc/UTC # your time zone, e.g. Europe/London, for the schedule and logs
      TAGDRIFTER_SCHEDULE: "0 4 * * *" # cron (min hour day month weekday), or "off"
      TAGDRIFTER_CASE_SENSITIVE: "true" # match the filesystem's case sensitivity
      TAGDRIFTER_WORKERS: "8" # parallel tag reads; mainly affects the first scan
      # Optional login: output of `docker exec -it tagdrifter tagdrifter hash-password`
      # TAGDRIFTER_PASSWORD_HASH: "scrypt:16384:8:1:..."
      # Optional: rename albums to their expected paths from the UI (needs the :rw mount)
      # TAGDRIFTER_FIX: "true"
      # Optional: notifications to Gotify (an application token from Gotify's Apps page)
      # TAGDRIFTER_GOTIFY_URL: "http://gotify.lan:8080"
      # TAGDRIFTER_GOTIFY_TOKEN: "..."
      # TAGDRIFTER_PUBLIC_URL: "https://tagdrifter.example" # links in notifications
      # Optional: compare tags with MusicBrainz (1 request/s, each release cached for weeks)
      # TAGDRIFTER_MUSICBRAINZ: "true"
      # TAGDRIFTER_MUSICBRAINZ_CONTACT: "you@example.com" # how MusicBrainz can reach you
      # TAGDRIFTER_MUSICBRAINZ_API_ROOT: "http://mirror:5000" # your own mirror, if any
      # TAGDRIFTER_MUSICBRAINZ_INTERVAL: "0" # seconds between requests; mirrors only
      # Optional: a secondary library of hard links; mount the folder holding both libraries
      # instead of /music, and see docs/deployment.md
      # TAGDRIFTER_LIBRARY: /libraries/music
      # TAGDRIFTER_SECONDARY: /libraries/secondary
      # TAGDRIFTER_SECONDARY_SYNC: "true" # let it write links there (needs the mount :rw)
