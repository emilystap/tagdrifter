name: Image

# Builds and smoke-tests the container on every push and pull request. Publishes to GHCR from
# main (tags: latest, sha-<short>) and from version tags v1.2.3 (tags: 1.2.3, 1.2, sha-<short>).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tagdrifter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (serves /healthz and scans an empty library)
        run: |
          mkdir -p /tmp/music
          docker run -d --name td -p 8080:8080 -e TAGDRIFTER_SCHEDULE=off \
            -v /tmp/music:/music:ro tagdrifter:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:8080/scan > /dev/null
          sleep 3
          curl -fsS http://127.0.0.1:8080/scans | grep -q completed || { docker logs td; exit 1; }
          docker logs td

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
