# Tag Drifter configuration. Copy to config.toml (git-ignored) and adjust.
# Environment variables override these: TAGDRIFTER_LIBRARY, TAGDRIFTER_DB,
# TAGDRIFTER_CASE_SENSITIVE, TAGDRIFTER_WORKERS, TAGDRIFTER_SCHEDULE, TAGDRIFTER_FIX,
# TAGDRIFTER_PUBLIC_URL, TAGDRIFTER_GOTIFY_URL, TAGDRIFTER_GOTIFY_TOKEN, TAGDRIFTER_NOTIFY_ON,
# TAGDRIFTER_MUSICBRAINZ, TAGDRIFTER_MUSICBRAINZ_CONTACT, TAGDRIFTER_SECONDARY,
# TAGDRIFTER_TRIAGE, TAGDRIFTER_CONFIG.

[library]
path = "M:/music"            # in Docker this will be "/music"
# Treat names differing only by letter case as different (match your filesystem).
case_sensitive = true
audio_extensions = [".flac", ".mp3"]
sidecar_extensions = [".lrc", ".txt"]
# File/folder names to skip (fnmatch patterns).
ignore = [".*", "@eaDir", "#recycle", "$RECYCLE.BIN", "Thumbs.db"]

[database]
path = "data/tagdrifter.db"

[scan]
workers = 8                  # parallel tag reads; raise for SMB, lower for spinning disks
# Automatic scans while `tagdrifter serve` runs: a cron expression (minute hour day month
# weekday) in the server's time zone, or "off". Scans are incremental, so daily is cheap.
schedule = "0 4 * * *"

[web]
# Require a password for the web UI. Generate the hash with `tagdrifter hash-password`
# (in Docker: `docker exec -it tagdrifter tagdrifter hash-password`). Unset = no login.
# password_hash = "scrypt:16384:8:1:..."
# The UI's address as you reach it (e.g. behind a reverse proxy), for links in notifications.
# public_url = "https://tagdrifter.example"

[fix]
# Let the web UI rename MBID-tagged albums to their expected paths (preview, apply, undo).
# Needs write access to the library. Env: TAGDRIFTER_FIX.
enabled = false

[notify]
# Push notifications to a Gotify server (an application token from Gotify's Apps page).
# Unset = no notifications. Env: TAGDRIFTER_GOTIFY_URL, TAGDRIFTER_GOTIFY_TOKEN.
# gotify_url = "http://gotify.lan:8080"
# gotify_token = "..."
# What to send: "new_issues" (a scan found issues that weren't open before), "failures" (a
# scan failed, or a rename was left half-done) and/or "triage" (albums moved in from the
# triage folder, or waiting there for you). Env: TAGDRIFTER_NOTIFY_ON.
on = ["new_issues", "failures", "triage"]

[musicbrainz]
# Look up each release on MusicBrainz for the mb.* checks: one request per release, at most
# one a second, a few at a time at random times of day (all at once after "Scan now"),
# cached for 45-75 days. Env: TAGDRIFTER_MUSICBRAINZ.
enabled = false
# How MusicBrainz can reach you (an email address or URL), added to the User-Agent next to
# the project URL. Optional, but MusicBrainz asks for a contact. Env:
# TAGDRIFTER_MUSICBRAINZ_CONTACT.
# contact = "you@example.com"
# Another MusicBrainz server, such as a musicbrainz-docker mirror of your own: the server or
# its /ws/2 web service root. Default: musicbrainz.org. Env: TAGDRIFTER_MUSICBRAINZ_API_ROOT.
# api_root = "http://mirror:5000"
# Seconds from each response to the next request (default 1.5). Can't be lower for
# musicbrainz.org; 0 is fine for a server of your own. Env: TAGDRIFTER_MUSICBRAINZ_INTERVAL.
# interval = 0

[secondary]
# A secondary library: the library's structure made of hard links to its files, minus exclusions
# (set on the Secondary page). On the same filesystem and, in Docker, under the same mount as
# the library. Its root must hold an empty `.tagdrifter-secondary` file (see `marker`).
# Env: TAGDRIFTER_SECONDARY.
# path = "M:/secondary"
# Allow syncing it (needs write access to the secondary). Env: TAGDRIFTER_SECONDARY_SYNC.
sync = false
# Require the `.tagdrifter-secondary` file, so a mistyped path does nothing. Turn it off if
# whatever reads the secondary would show the file. Env: TAGDRIFTER_SECONDARY_MARKER.
marker = true
# Leave albums out while they have an open issue of this severity or worse: "error",
# "warning" or "info" ("off" = never). They're linked again at the first sync after the issues
# are resolved. Env: TAGDRIFTER_SECONDARY_EXCLUDE_ISSUES.
exclude_issues = "off"

[triage]
# A folder for newly tagged files: albums move from here into the library at their expected
# paths, on their own when the checks find nothing of warning severity or worse (path checks
# aside), else once confirmed on the Triage page. Files are moved, never copied, so it must be
# on the library's filesystem and, in Docker, under the same read-write mount.
# Env: TAGDRIFTER_TRIAGE.
# path = "M:/triage"
# Seconds between automatic runs in the web app (0 = only "Process now" and the CLI).
# Env: TAGDRIFTER_TRIAGE_INTERVAL.
interval = 300
# Seconds a folder's files must be left alone before they move (still copying or tagging).
# Env: TAGDRIFTER_TRIAGE_SETTLE.
settle = 120

[checks]
# Check ids to switch off (see `tagdrifter checks`).
disabled = []

# Extra tags every track must have. "a|b" means either one satisfies the requirement.
# MBIDs (tags.recording_mbid, tags.mbids) and the tags the naming rules use (tags.naming)
# have their own checks, so this is empty by default.
[checks."tags.required"]
tags = []

# Embedded cover art. min_size (pixels, shorter side) flags small front covers; 0 = off.
# require_front_cover flags tracks whose pictures are all other types (back, booklet, ...).
[checks."album.cover_art"]
min_size = 0
require_front_cover = true

# ReplayGain and R128 gain tags. "none" reports every album that has any; "consistent" keeps
# them, reporting albums where only some tracks have them, a value is invalid or the album
# gain differs within a disc.
[checks."album.replaygain"]
expect = "none"

# How far a track's audio length may differ from MusicBrainz before mb.duration reports it.
[checks."mb.duration"]
tolerance_seconds = 3
# For releases without track lengths: the gap from the recording's length (from its other
# releases) before it's reported, as info.
recording_tolerance_seconds = 30

# Artist folders follow the album artist's current name in MusicBrainz once a release is looked
# up ("musicbrainz"), so a name change doesn't split an artist; "album_artist" goes by the tags.
[checks."album.placement"]
artist_folder = "musicbrainz"

# Tags that every track in one album folder should agree on.
[checks."album.inconsistent_tags"]
tags = ["albumartist", "album", "musicbrainz_albumid", "musicbrainz_albumartistid"]
