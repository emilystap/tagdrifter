{% extends "base.html" %}
{% block title %}Issues · Tag Drifter{% endblock %}
{% block content %}
{% import "_issue_facets.html" as facets %}
<form id="filters" class="filters" method="get" action="/issues"
      hx-get="/issues" hx-target="#results" hx-push-url="true"
      hx-trigger="input changed delay:250ms, submit" hx-sync="this:replace">
  <label>
    <span>Check</span>
    {{ facets.check_select(check_counts, params.check) }}
  </label>
  <label>
    <span>Severity</span>
    <select name="severity">
      <option value="">Any</option>
      {% for s in ["error", "warning", "info"] %}
        <option value="{{ s }}" {% if params.severity == s %}selected{% endif %}>{{ s | capitalize }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    <span>Artist</span>
    {{ facets.artist_select(artists, params.artist) }}
  </label>
  <label>
    <span>MBIDs</span>
    <select name="mbid">
      <option value="">Any</option>
      <option value="yes" {% if params.mbid == "yes" %}selected{% endif %}>MBID-tagged</option>
      <option value="no" {% if params.mbid == "no" %}selected{% endif %}>Not MBID-tagged</option>
    </select>
  </label>
  <label>
    <span>Show</span>
    <select name="view">
      <option value="album" {% if view == "album" %}selected{% endif %}>By album</option>
      <option value="list" {% if view == "list" %}selected{% endif %}>Every issue</option>
    </select>
  </label>
  {% if params.scan %}
  <label>
    <span>Scan</span>
    <select name="scan">
      <option value="{{ params.scan }}" selected>New in #{{ params.scan }}</option>
      <option value="">Any scan</option>
    </select>
  </label>
  {% endif %}
  <label class="grow">
    <span>Search path or message</span>
    <input type="search" name="q" value="{{ params.q }}" placeholder="e.g. Born This Way" autocomplete="off">
  </label>
  <button type="submit" class="button">Filter</button>
</form>

<div id="results">
  {% include "_issue_results.html" %}
</div>
{% endblock %}
