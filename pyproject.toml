[project]
name = "tagdrifter"
version = "0.1.0"
description = "Monitors a music library for files that drift from its naming and tagging conventions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.47",
]

# [project.scripts] CLI entry point arrives in step 2 (scanner + database).

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagdrifter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Ambiguous-unicode warnings fire on the deliberate filesystem-safe substitutes (∕ ∗ ∣ ″ “ ”).
ignore = ["RUF001", "RUF002", "RUF003"]
