[project]
name = "tagdrifter"
version = "0.1.0"
description = "Monitors a music library for files that drift from its naming and tagging conventions."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "mutagen>=1.47",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
tagdrifter = "tagdrifter.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagdrifter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Ambiguous-unicode warnings fire on the deliberate filesystem-safe substitutes
# (∕ ꞉ ∗ ∣ ？ ‹ › ․ ″ “ ”). Only the sanitizer and the tests use them; keep the rules on elsewhere.
"src/tagdrifter/core/sanitize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["RUF001", "RUF002", "RUF003"]
